<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aïkido">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Aïkido – Entraînement</title>
  <link rel="icon" href="favicon.ico?v=20261113" sizes="any">
  <link rel="stylesheet" href="style.css?v=20261113">
</head>
<body>
  <main>
    <h1>合気道 Aïkido</h1>

    <section id="home">
      <div class="group settings">
        <label class="field">Grade
          <select id="grade"></select>
        </label>
        <div class="filters">
          <label><input type="checkbox" id="f-nouveau"> 🆕 Nouveautés</label>
          <label><input type="checkbox" id="f-attention"> ⚠️ Attention</label>
        </div>
      </div>
      <div class="group grow">
        <p class="hint">Choisissez un waza :</p>
        <div id="waza-buttons" class="buttons grow"></div>
        <p id="home-msg" class="hint"></p>
      </div>
    </section>

    <section id="draw" hidden>
      <p id="progress" class="hint"></p>
      <div id="card" class="card">
        <div id="card-waza" class="waza"></div>
        <div id="card-attaque" class="attaque"></div>
        <div id="card-technique" class="technique"></div>
        <div id="card-forme" class="forme"></div>
        <div id="card-badges" class="badges"></div>
        <div id="card-note" class="note"></div>
        <a id="card-video" class="video" target="_blank" rel="noopener" hidden>▶ Voir la vidéo</a>
      </div>
      <div id="done" hidden>Waza terminé 🎉</div>
      <div class="buttons actions">
        <button id="next">Technique suivante</button>
        <button id="home-btn" class="secondary">Retour à l'accueil</button>
        <button id="prog-btn" class="secondary">Voir le programme</button>
      </div>
    </section>

    <section id="program" hidden>
      <button id="prog-back" class="secondary back"></button>
      <div id="prog-card" class="card" hidden>
        <div id="prog-waza" class="waza"></div>
        <div id="prog-attaque" class="attaque"></div>
        <div id="prog-technique" class="technique"></div>
        <div id="prog-forme" class="forme"></div>
        <div id="prog-badges" class="badges"></div>
        <div id="prog-note" class="note"></div>
        <a id="prog-video" class="video" target="_blank" rel="noopener" hidden>▶ Voir la vidéo</a>
      </div>
      <div class="group">
        <h2 id="prog-title"></h2>
        <p id="prog-sub" class="hint"></p>
        <div id="prog-list" class="buttons"></div>
      </div>
    </section>
  </main>
  <script src="app.js?v=20261113"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
