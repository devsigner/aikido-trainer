<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Counter — framework example</title>
</head>
<body>
  <div id="app"></div>
  <!-- Serve the repository root (e.g. `python3 -m http.server`) and open /examples/counter/ -->
  <script type="module">
    import { combine } from "../../framework/elmer/feature.js";
    import { createRenderer } from "../../framework/elmer/vdom.js";
    import { run } from "../../framework/elmer/runtime.js";
    import { features, view } from "./features.js";

    const app = combine(features);
    const renderer = createRenderer(document.getElementById("app"));
    // Debugger (🐞): on by default on localhost; elsewhere, `__elmer.debug()` in the console mounts or unmounts it.
    run({ init: app.init, update: app.update, view, render: renderer, effects: app.effects({}), devtools: { slices: Object.keys(features) } });
  </script>
</body>
</html>
