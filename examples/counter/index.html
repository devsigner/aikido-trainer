<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Counter — framework example</title>
</head>
<body>
  <div id="app"></div>
  <!-- Serve the repository root (e.g. `python3 -m http.server`) and open /examples/counter/ -->
  <script type="module">
    import { combine, createEffects, createRenderer, run } from "../../framework/elmer/index.js";
    import { features, view } from "./features.js";

    const app = combine(features);
    const renderer = createRenderer(document.getElementById("app"));
    // Debugger (🐞): on by default on localhost; elsewhere, `__elmer.debug.on()` / `.off()` in the console mount or unmount it.
    run({ init: app.init, update: app.update, view, render: renderer, effects: createEffects(app), devtools: {} });
  </script>
</body>
</html>
